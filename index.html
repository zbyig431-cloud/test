<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Q 辞書ツール</title>
    <style>
        * { box-sizing: border-box; font-family: 'Courier New', Courier, monospace, sans-serif; -webkit-tap-highlight-color: transparent; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #0c0714;
            color: #ebd6ff;
            overflow: hidden;
            -webkit-overflow-scrolling: touch;
            user-select: none;
            -webkit-user-select: none;
        }

        /* --- ホーム画面 --- */
        .home-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: clamp(24px, 6vw, 64px);
            gap: clamp(20px, 3vh, 32px);
            background: radial-gradient(ellipse at center, #1a0d2e 0%, #0c0714 100%);
        }
        .home-title {
            font-size: clamp(2rem, 5vw, 3.4rem);
            font-weight: bold;
            color: #b57cff;
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(181, 124, 255, 0.4);
        }
        .home-subtitle {
            font-size: clamp(0.85rem, 2vw, 1.15rem);
            color: #8a6db5;
            text-align: center;
            line-height: 1.4;
        }
        .home-input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: min(100%, 520px);
        }
        .home-input-group label {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            color: #b57cff;
            font-weight: bold;
        }
        .home-input-group input {
            width: 100%;
            background: #140d21;
            border: 3px solid #b57cff;
            color: #00ff66;
            padding: 14px 18px;
            font-size: clamp(1rem, 2.5vw, 1.35rem);
            border-radius: 10px;
            height: clamp(54px, 8vh, 72px);
        }
        .btn-goto-scan {
            width: min(100%, 520px);
            height: clamp(60px, 9vh, 80px);
            background: linear-gradient(135deg, #5500aa, #220055);
            color: #ebd6ff;
            border: 3px solid #b57cff;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 16px rgba(181, 124, 255, 0.4);
        }
        .btn-goto-scan:active { background: #00ff64; color: #000; }
        .home-saved-key {
            font-size: clamp(0.75rem, 1.8vw, 1rem);
            color: #8a6db5;
        }

        .app-wrapper {
            padding: 6px;
            display: none;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            gap: 6px;
            overflow: hidden;
        }
        .app-wrapper.active { display: flex; }

        /* トップバー */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(181, 124, 255, 0.2);
            height: 28px;
            flex-shrink: 0;
        }
        h1 {
            font-size: 1rem;
            margin: 0;
            color: #b57cff;
            letter-spacing: 1px;
        }
        .btn-home {
            background: #1a0d2e;
            color: #b57cff;
            border: 1px solid rgba(181, 124, 255, 0.5);
            font-size: 0.75rem;
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            height: 24px;
        }
        .btn-home:active { background: #b57cff; color: #000; }

        /* メインレイアウト */
        .main-layout {
            display: flex;
            flex: 1 1 auto;
            gap: 8px;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            align-items: flex-start;
        }

        /* --- 左カラム: カメラ & 結果 & 電卓 --- */
        .left-column {
            flex: 40 0 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            min-width: 0;
        }
        .camera-container {
            width: 100%;
            aspect-ratio: 9 / 20;
            max-height: 45vh;
            background: #000;
            border: 2px solid #b57cff;
            position: relative;
            border-radius: 6px;
            overflow: hidden;
            flex-shrink: 0;
            margin: 0 auto;
        }
        #camera-stream { width: 100%; height: 100%; object-fit: cover; }

        /* 計算結果表示 */
        .result-display {
            width: 100%;
            min-height: 92px;
            background: #06030a;
            border: 3px solid #b57cff;
            border-radius: 10px;
            padding: 8px 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            gap: 4px;
            box-shadow: 0 0 10px rgba(181, 124, 255, 0.22);
        }
        .result-display .res-title {
            font-size: 0.72rem;
            color: #b57cff;
            line-height: 1rem;
        }
        .result-display .res-num {
            width: 100%;
            font-size: clamp(2rem, 5vw, 3.4rem);
            font-weight: bold;
            color: #ff007f;
            text-shadow: 0 0 8px #ff007f;
            line-height: 1;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        /* --- 右カラム --- */
        .right-column {
            flex: 60 0 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 0;
            position: relative;
        }

        .section-title {
            font-size: 0.7rem;
            font-weight: bold;
            color: #b57cff;
            margin-bottom: 4px;
        }

        /* スロット表示エリア */
        .slots-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            flex-shrink: 0;
        }
        .slot-box {
            background: #150f24;
            border: 2px solid rgba(181, 124, 255, 0.4);
            border-radius: 8px;
            padding: 6px 4px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 64px;
        }
        .slot-box.selected {
            border: 2px solid #ff007f;
            background: #2b0c1e;
        }
        .slot-box .label { font-size: 0.65rem; color: #b57cff; pointer-events: none; }
        .slot-box.selected .label { color: #ff007f; }
        .slot-box .kanji-display {
            font-size: 1.8rem;
            color: #ffffff;
            font-weight: bold;
            min-height: 2rem;
            line-height: 2rem;
            pointer-events: none;
        }
        .slot-box .page-output {
            font-size: 1rem;
            font-weight: bold;
            color: #00ff64;
            min-height: 1.1rem;
            pointer-events: none;
        }

        /* サジェスト */
        /* 認識しにくい漢字 */
        .fallback-kanji-container {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
            flex-shrink: 0;
        }
        .btn-fallback-kanji {
            min-height: 76px;
            padding: 8px 4px;
            background: #25163a;
            border: 2px solid #b57cff;
            color: #ebd6ff;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
        }
        .btn-fallback-kanji .kanji {
            font-size: clamp(1.6rem, 4vw, 2.4rem);
            line-height: 1;
            font-weight: bold;
        }
        .btn-fallback-kanji .page {
            color: #00ff64;
            font-size: clamp(0.8rem, 2vw, 1rem);
            font-weight: bold;
        }
        .btn-fallback-kanji:active { background: #00ff64; color: #000; }
        .btn-fallback-kanji:active .page { color: #000; }

        /* --- 計算ボタン --- */
        .calc-buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            flex-shrink: 0;
        }
        .btn-calc {
            background: #2b124c;
            border: 2px solid #ff007f;
            color: #ff007f;
            font-size: clamp(1.15rem, 3vw, 1.8rem);
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            aspect-ratio: 1 / 1;
        }
        .btn-calc:active { background: #ff007f; color: #000; }

        /* クリアボタン */
        .reset-container {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            flex-shrink: 0;
        }
        .btn-reset-half {
            width: 100%;
            background: #3a1525;
            border: 2px solid #ff3388;
            color: #ff99cc;
            font-size: clamp(1.15rem, 3vw, 1.8rem);
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            aspect-ratio: 3 / 1;
        }
        .btn-reset-half:active { background: #ff3388; color: #fff; }

        /* スキャン丸ボタン */
        .scan-button-area {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 0 0 auto;
            padding: 4px 0 2px;
        }
        .btn-scan-circle {
            width: 100%;
            height: 64px;
            border-radius: 12px;
            background: linear-gradient(135deg, #5500aa, #220055);
            color: #ebd6ff;
            border: 3px solid #b57cff;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            box-shadow: 0 0 12px rgba(181, 124, 255, 0.4);
        }
        .btn-scan-circle:active { background: #00ff64; color: #000; }

        /* --- 横向き画面 --- */
        @media (orientation: landscape) and (min-width: 721px) {
            .app-wrapper { gap: 4px; padding: 4px; }
            .top-bar { height: 24px; }
            .main-layout {
                flex: 1 1 0;
                min-height: 0;
                gap: 6px;
                overflow: hidden;
                height: auto;
                align-items: stretch;
            }
            .left-column, .right-column {
                gap: 5px;
                height: 100%;
                min-height: 0;
                display: flex;
                flex-direction: column;
            }
            .camera-container { aspect-ratio: auto; max-height: 30vh; height: 30vh; flex: 0 0 auto; }
            .result-display {
                flex: 1 1 auto;
                min-height: 120px;
                padding: 12px 10px;
                gap: 8px;
            }
            .result-display .res-title { font-size: clamp(0.9rem, 2vw, 1.2rem); }
            .result-display .res-num { font-size: clamp(3.2rem, 8vw, 6rem); }
            .slot-box { min-height: 52px; padding: 4px 3px; }
            .slot-box .kanji-display { font-size: 1.45rem; line-height: 1.5rem; min-height: 1.5rem; }
            .slot-box .page-output { font-size: 0.8rem; }
            .fallback-kanji-container { gap: 5px; }
            .btn-fallback-kanji { min-height: 64px; padding: 4px 2px; }
            .btn-calc { font-size: clamp(0.95rem, 2.5vw, 1.45rem); }
            .btn-reset-half { font-size: clamp(0.95rem, 2.5vw, 1.35rem); }
            .btn-scan-circle { height: 52px; font-size: 1.05rem; }
            .scan-button-area { padding: 2px 0; }
            .slot-box { min-height: 60px; }
            .btn-fallback-kanji { min-height: 72px; }
        }

        /* --- 短い画面向けレスポンシブ調整 --- */
        @media (max-width: 720px) {
            .app-wrapper { overflow: hidden; }
            .main-layout {
                flex-direction: column;
                overflow-y: auto;
                overflow-x: hidden;
            }
            .left-column,
            .right-column {
                width: 100%;
                flex: 0 0 auto;
            }
            .camera-container {
                aspect-ratio: 16 / 9;
                max-height: 42vh;
            }
            .fallback-kanji-container { gap: 6px; }
            .btn-fallback-kanji { min-height: 72px; }
        }

        @media (max-height: 1000px) and (min-width: 721px) and (orientation: landscape) {
            .camera-container { max-height: 26vh; height: 26vh; }
            .result-display {
                flex: 1 1 auto;
                min-height: 120px;
            }
            .result-display .res-num { font-size: clamp(3.2rem, 8vw, 6rem); }
            .slot-box { min-height: 56px; padding: 4px 3px; }
            .slot-box .kanji-display { font-size: 1.5rem; line-height: 1.6rem; min-height: 1.6rem; }
            .slot-box .page-output { font-size: 0.85rem; }
            .fallback-kanji-container { gap: 5px; }
            .btn-fallback-kanji { min-height: 60px; }
        }

        /* 余りセレクターオーバーレイ */
        .mod-selector-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(12, 7, 20, 0.96);
            border-radius: 8px;
            z-index: 20;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 8px;
            gap: 8px;
        }
        .mod-selector-title {
            font-size: 0.85rem;
            color: #ff007f;
            font-weight: bold;
        }
        .mod-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            width: 100%;
        }
        .btn-mod-num {
            background: #1d0e30;
            border: 2px solid #b57cff;
            color: #00ff66;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            padding: 10px 0;
        }
        .btn-mod-num:active { background: #00ff66; color: #000; }
        .btn-mod-cancel {
            grid-column: span 5;
            background: #333;
            border: none;
            color: #fff;
            padding: 8px;
            font-size: 0.85rem;
            border-radius: 8px;
        }

        .loading-dimmer {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(20, 5, 35, 0.5); z-index: 10; justify-content: center; align-items: center;
            font-size: 0.9rem; color: #00ff66;
        }
        .loading-dimmer::after { content: "SCANNING KANJI..."; animation: blink 0.5s infinite alternate; }
        @keyframes blink { from { opacity: 0.3; } to { opacity: 1; } }
    </style>

</head>
<body>

    <div class="home-screen" id="home-screen">
        <div class="home-title">Q 辞書ツール</div>
        <div class="home-subtitle">漢字をスキャンしてページ番号を検索</div>
        <div class="home-input-group">
            <label for="api-key">API PASS</label>
            <input type="password" id="api-key" placeholder="AIzaSy...">
        </div>
        <button class="btn-goto-scan" id="btn-goto-scan">スキャン画面へ</button>
        <div class="home-saved-key" id="home-saved-key"></div>
    </div>

    <div class="app-wrapper" id="app-wrapper">

        <!-- トップバー -->
        <div class="top-bar">
            <h1>Q 辞書ツール</h1>
            <button class="btn-home" id="btn-home">ホーム</button>
        </div>

        <div class="main-layout">

            <!-- 左カラム: カメラ + 結果 + 電卓 -->
            <div class="left-column">
                <div class="camera-container">
                    <video id="camera-stream" autoplay playsinline muted></video>
                    <div class="loading-dimmer" id="scan-indicator"></div>
                </div>

                <!-- 計算結果表示 -->
                <div class="result-display">
                    <div class="res-title">ANS</div>
                    <div class="res-num" id="calc-result">000</div>
                </div>

                <!-- 電卓トグル -->
                <button class="btn-calc-toggle" id="calc-toggle-btn">電卓</button>

                <!-- スキャン丸ボタン -->
                <div class="scan-button-area">
                    <button class="btn-scan-circle" id="shutter-trigger">スキャン</button>
                </div>

                <!-- 電卓パネル -->
                <div class="calc-panel-overlay" id="calc-panel-overlay">
                    <div class="calc-display" id="calc-display">0</div>
                    <div class="calc-keypad">
                        <button class="btn-calc-key cl" onclick="calcKey('C')">C</button>
                        <button class="btn-calc-key op" onclick="calcKey('÷')">÷</button>
                        <button class="btn-calc-key op" onclick="calcKey('×')">×</button>
                        <button class="btn-calc-key op" onclick="calcKey('−')">−</button>
                        <button class="btn-calc-key" onclick="calcKey('7')">7</button>
                        <button class="btn-calc-key" onclick="calcKey('8')">8</button>
                        <button class="btn-calc-key" onclick="calcKey('9')">9</button>
                        <button class="btn-calc-key op" onclick="calcKey('+')">+</button>
                        <button class="btn-calc-key" onclick="calcKey('4')">4</button>
                        <button class="btn-calc-key" onclick="calcKey('5')">5</button>
                        <button class="btn-calc-key" onclick="calcKey('6')">6</button>
                        <button class="btn-calc-key eq" onclick="calcKey('=')" style="grid-column: 4; grid-row: 3 / span 3;">＝</button>
                        <button class="btn-calc-key" onclick="calcKey('1')">1</button>
                        <button class="btn-calc-key" onclick="calcKey('2')">2</button>
                        <button class="btn-calc-key" onclick="calcKey('3')">3</button>
                        <button class="btn-calc-key cl" onclick="calcKey('exit')" style="font-size: 1.4rem;">🚪</button>
                        <button class="btn-calc-key" onclick="calcKey('0')" style="grid-column: span 2;">0</button>
                    </div>
                </div>
            </div>

            <!-- 右カラム: スロット + サジェスト + 計算ボタン + クリア + スキャン -->
            <div class="right-column">

                <!-- スロット -->
                <div>
                    <div class="section-title">【スロット】タップ固定</div>
                    <div class="slots-container">
                        <div class="slot-box" id="slot-container-0" onclick="toggleSlotSelect(0)">
                            <span class="label">S1</span>
                            <div class="kanji-display" id="slot-k-0">-</div>
                            <span class="page-output" id="slot-p-0">---</span>
                        </div>
                        <div class="slot-box" id="slot-container-1" onclick="toggleSlotSelect(1)">
                            <span class="label">S2</span>
                            <div class="kanji-display" id="slot-k-1">-</div>
                            <span class="page-output" id="slot-p-1">---</span>
                        </div>
                        <div class="slot-box" id="slot-container-2" onclick="toggleSlotSelect(2)">
                            <span class="label">S3</span>
                            <div class="kanji-display" id="slot-k-2">-</div>
                            <span class="page-output" id="slot-p-2">---</span>
                        </div>
                        <div class="slot-box" id="slot-container-3" onclick="toggleSlotSelect(3)">
                            <span class="label">S4</span>
                            <div class="kanji-display" id="slot-k-3">-</div>
                            <span class="page-output" id="slot-p-3">---</span>
                        </div>
                    </div>
                </div>

                <!-- 認識しにくい漢字 -->
                <div class="fallback-kanji-container" aria-label="認識しにくい漢字">
                    <button class="btn-fallback-kanji" onclick="addKanjiToSlot('開')">
                        <span class="kanji">開</span><span class="page">1226p</span>
                    </button>
                    <button class="btn-fallback-kanji" onclick="addKanjiToSlot('黶')">
                        <span class="kanji">黶</span><span class="page">1334p</span>
                    </button>
                    <button class="btn-fallback-kanji" onclick="addKanjiToSlot('謦')">
                        <span class="kanji">謦</span><span class="page">1109p</span>
                    </button>
                    <button class="btn-fallback-kanji" onclick="addKanjiToSlot('羸')">
                        <span class="kanji">羸</span><span class="page">963p</span>
                    </button>
                </div>

                <!-- 計算ボタン -->
                <div class="calc-buttons">
                    <button class="btn-calc" aria-label="足し算" onclick="calculate('add')">＋</button>
                    <button class="btn-calc" aria-label="引き算" onclick="calculate('sub')">−</button>
                    <button class="btn-calc" aria-label="最大値を2倍" onclick="calculate('double')">倍</button>
                    <button class="btn-calc" aria-label="余り" onclick="calculate('rem')">余</button>
                    <button class="btn-calc" aria-label="末尾数字の並べ替え" onclick="calculate('sort_digits')">🔁</button>
                </div>

                <!-- クリアボタン -->
                <div class="reset-container">
                    <button class="btn-reset-half" id="btn-clear-slots">スロットクリア</button>
                    <button class="btn-reset-half" id="btn-clear-result">結果クリア</button>
                </div>

                <!-- 余りセレクターオーバーレイ -->
                <div class="mod-selector-overlay" id="mod-overlay">
                    <div class="mod-selector-title">最大ページ数を何で割る？</div>
                    <div class="mod-grid">
                        <button class="btn-mod-num" onclick="execModCalculated(1)">1</button>
                        <button class="btn-mod-num" onclick="execModCalculated(2)">2</button>
                        <button class="btn-mod-num" onclick="execModCalculated(3)">3</button>
                        <button class="btn-mod-num" onclick="execModCalculated(4)">4</button>
                        <button class="btn-mod-num" onclick="execModCalculated(5)">5</button>
                        <button class="btn-mod-num" onclick="execModCalculated(6)">6</button>
                        <button class="btn-mod-num" onclick="execModCalculated(7)">7</button>
                        <button class="btn-mod-num" onclick="execModCalculated(8)">8</button>
                        <button class="btn-mod-num" onclick="execModCalculated(9)">9</button>
                        <button class="btn-mod-cancel" onclick="closeModOverlay()">戻る</button>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <canvas id="capture-canvas" style="display:none;"></canvas>

    <script type="module">
        const KANJI_DICTIONARY = {
            "七":7,"下":8,"丈":16,"丘":22,"並":25,"丸":29,"丼":31,"衣":31,"起":31,"也":36,"井":48,

        let streamObject = null;
        let selectedSlots = new Set();

        const displays = [
            document.getElementById('slot-k-0'), document.getElementById('slot-k-1'),
            document.getElementById('slot-k-2'), document.getElementById('slot-k-3')
        ];
        const outputs = [
            document.getElementById('slot-p-0'), document.getElementById('slot-p-1'),
            document.getElementById('slot-p-2'), document.getElementById('slot-p-3')
        ];
        const containers = [
            document.getElementById('slot-container-0'), document.getElementById('slot-container-1'),
            document.getElementById('slot-container-2'), document.getElementById('slot-container-3')
        ];

        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('page_ocr_api_key');
            if (savedKey) {
                document.getElementById('api-key').value = savedKey;
                document.getElementById('home-saved-key').innerText = 'PASS設定済み';
            }

            initCameraStream();

            document.getElementById('shutter-trigger').addEventListener('click', captureAndScan);
            document.getElementById('btn-clear-slots').addEventListener('click', clearSlotsOnly);
            document.getElementById('btn-clear-result').addEventListener('click', clearResultOnly);
            document.getElementById('btn-goto-scan').addEventListener('click', () => {
                const key = document.getElementById('api-key').value.trim();
                if (!key) { alert('PASSを入力してください'); return; }
                localStorage.setItem('page_ocr_api_key', key);
                document.getElementById('home-saved-key').innerText = 'PASS設定済み';
                document.getElementById('home-screen').style.display = 'none';
                document.getElementById('app-wrapper').classList.add('active');
            });

            document.getElementById('btn-home').addEventListener('click', () => {
                document.getElementById('home-screen').style.display = 'flex';
                document.getElementById('app-wrapper').classList.remove('active');
            });

            document.getElementById('api-key').addEventListener('change', () => {
                localStorage.setItem('page_ocr_api_key', document.getElementById('api-key').value);
                document.getElementById('home-saved-key').innerText = 'PASS設定済み';
            });
        });

        async function initCameraStream() {
            const video = document.getElementById('camera-stream');
            try {
                const constraints = {
                    video: { facingMode: { exact: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                };
                streamObject = await navigator.mediaDevices.getUserMedia(constraints)
                    .catch(() => navigator.mediaDevices.getUserMedia({
                        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
                        audio: false
                    }))
                    .catch(() => navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }))
                    .catch(() => navigator.mediaDevices.getUserMedia({ video: true, audio: false }));
                video.srcObject = streamObject;
            } catch (err) { alert("カメラ起動失敗: " + err.message); }
        }

        window.toggleSlotSelect = function(idx) {
            if (selectedSlots.has(idx)) {
                selectedSlots.delete(idx);
                containers[idx].classList.remove('selected');
            } else {
                selectedSlots.add(idx);
                containers[idx].classList.add('selected');
            }
        }

        function clearAllSelections() {
            selectedSlots.clear();
            containers.forEach(c => c.classList.remove('selected'));
        }

        function preprocessCapture(video) {
            const canvas = document.getElementById('capture-canvas');

            const vw = video.videoWidth || 1280;
            const vh = video.videoHeight || 720;

            canvas.width = vw;
            canvas.height = vh;

            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;

            let minLum = 255, maxLum = 0;
            for (let i = 0; i < data.length; i += 4) {
                const lum = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                if (lum < minLum) minLum = lum;
                if (lum > maxLum) maxLum = lum;
            }

            const range = Math.max(1, maxLum - minLum);
            for (let i = 0; i < data.length; i += 4) {
                const lum = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                const stretched = ((lum - minLum) / range) * 255;
                const ratio = lum > 0 ? stretched / lum : 1;
                data[i]     = Math.min(255, Math.max(0, data[i] * ratio));
                data[i + 1] = Math.min(255, Math.max(0, data[i + 1] * ratio));
                data[i + 2] = Math.min(255, Math.max(0, data[i + 2] * ratio));
            }
            ctx.putImageData(imgData, 0, 0);

            return canvas.toDataURL('image/jpeg', 0.85).replace(/^data:image\/jpeg;base64,/, "");
        }

        async function captureAndScan() {
            const video = document.getElementById('camera-stream');
            const apiKey = document.getElementById('api-key').value.trim();

            if (!apiKey) return alert("PASSを入力してください。");
            if (!video.srcObject) return alert("カメラ未準備");

            const indicator = document.getElementById('scan-indicator');
            indicator.style.display = 'flex';

            try {
                const base64Image = preprocessCapture(video);

                const response = await fetch(`https://vision.googleapis.com/v1/images:annotate?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        requests: [{
                            image: { content: base64Image },
                            features: [
                                { type: "TEXT_DETECTION", maxResults: 10 }
                            ],
                            imageContext: {
                                languageHints: ["ja", "ja-t-i0-handwrit"]
                            }
                        }]
                    })
                });
                const data = await response.json();
                const resp = data.responses[0];

                const fullText = resp?.textAnnotations?.[0]?.description || "";
                const symbolChars = [];
                if (resp?.textAnnotations) {
                    for (let i = 1; i < resp.textAnnotations.length; i++) {
                        const desc = resp.textAnnotations[i].description || "";
                        for (let ch of desc) {
                            if (ch.trim()) symbolChars.push(ch);
                        }
                    }
                }

                processDetectedText(fullText, symbolChars);
            } catch (e) {
                alert("スキャンエラー");
            } finally {
                indicator.style.display = 'none';
            }
        }

        function processDetectedText(text, symbolChars) {
            if (!symbolChars) symbolChars = [];

            const regex = /[「『](.*?)[」』]/g;
            let rawMatches = [];
            let match;
            while ((match = regex.exec(text)) !== null) {
                if (match[1]) {
                    for (let char of match[1]) {
                        if (char.trim()) rawMatches.push(char);
                    }
                }
            }

            if (rawMatches.length === 0) {
                for (let char of text) {
                    if (KANJI_DICTIONARY[char] || char === "下" || char === "開") {
                        rawMatches.push(char);
                    }
                }
            }

            for (let char of symbolChars) {
                if (KANJI_DICTIONARY[char] && !rawMatches.includes(char)) {
                    rawMatches.push(char);
                }
            }

            let forceSuggestShita = false;
            let forceSuggestHiraki = false;
            let processedMatches = [];

            rawMatches.forEach(char => {
                if (char === "下" || char === "卞") {
                    processedMatches.push("卞");
                    forceSuggestShita = true;
                } else if (char === "開" || char === "鬨") {
                    processedMatches.push("鬨");
                    forceSuggestHiraki = true;
                } else {
                    processedMatches.push(char);
                }
            });

            for (let i = 0; i < 4; i++) {
                if (!selectedSlots.has(i)) {
                    displays[i].innerText = "-";
                    outputs[i].innerText = "---";
                }
            }

            processedMatches.forEach(char => {
                if (!KANJI_DICTIONARY[char]) return;

                let isDuplicate = false;
                for (let i = 0; i < 4; i++) {
                    if (displays[i].innerText === char) { isDuplicate = true; break; }
                }
                if (isDuplicate) return;

                let targetIdx = -1;
                for (let i = 0; i < 4; i++) {
                    if (!selectedSlots.has(i) && (displays[i].innerText === "-" || !displays[i].innerText)) {
                        targetIdx = i;
                        break;
                    }
                }

                if (targetIdx !== -1) {
                    displays[targetIdx].innerText = char;
                    outputs[targetIdx].innerText = KANJI_DICTIONARY[char];
                }
            });

            const newKanji = new Set();

            processedMatches.forEach(char => {
                if (!KANJI_DICTIONARY[char]) return;

                let isDuplicate = false;
                for (let i = 0; i < 4; i++) {
                    if (displays[i].innerText === char) { isDuplicate = true; break; }
                }
                if (isDuplicate) return;

                let targetIdx = -1;
                for (let i = 0; i < 4; i++) {
                    if (!selectedSlots.has(i) && (displays[i].innerText === "-" || !displays[i].innerText)) {
                        targetIdx = i;
                        break;
                    }
                }

                if (targetIdx !== -1) {
                    displays[targetIdx].innerText = char;
                    outputs[targetIdx].innerText = KANJI_DICTIONARY[char];
                    newKanji.add(char);
                }
            });

            if (newKanji.size === 1) {
                const [kanji] = newKanji;
                document.getElementById('calc-result').innerText = KANJI_DICTIONARY[kanji];
            }
        }

        window.addKanjiToSlot = function(kanji) {
            if (!KANJI_DICTIONARY[kanji]) return;

            for (let i = 0; i < 4; i++) {
                if (displays[i].innerText === kanji) return;
            }

            for (let i = 0; i < 4; i++) {
                if (!selectedSlots.has(i) && (displays[i].innerText === "-" || !displays[i].innerText)) {
                    displays[i].innerText = kanji;
                    outputs[i].innerText = KANJI_DICTIONARY[kanji];
                    return;
                }
            }
        }

        window.calculate = function(type) {
            let allPages = [];
            for (let i = 0; i < 4; i++) {
                const pVal = parseInt(outputs[i].innerText);
                if (!isNaN(pVal)) allPages.push(pVal);
            }

            if (type === 'double') {
                if (allPages.length === 0) { document.getElementById('calc-result').innerText = "ERR"; return; }
                const maxNum = Math.max(...allPages);
                document.getElementById('calc-result').innerText = maxNum * 2;
                clearAllSelections();
                return;
            }

            if (type === 'sort_digits') {
                if (allPages.length === 0) { document.getElementById('calc-result').innerText = "ERR"; return; }
                allPages.sort((a, b) => b - a);
                let combinedResult = "";
                allPages.forEach(p => { combinedResult += (p % 10).toString(); });
                document.getElementById('calc-result').innerText = combinedResult;
                clearAllSelections();
                return;
            }

            if (type === 'sub') {
                if (allPages.length < 1) { document.getElementById('calc-result').innerText = "ERR"; return; }
                const maxNum = Math.max(...allPages);
                const minNum = Math.min(...allPages);
                document.getElementById('calc-result').innerText = maxNum - minNum;
                clearAllSelections();
                return;
            }

            if (type === 'rem') {
                if (allPages.length === 0) { alert("数値がありません"); return; }
                document.getElementById('mod-overlay').style.display = 'flex';
                return;
            }

            let pages = [];
            selectedSlots.forEach(idx => {
                const pVal = parseInt(outputs[idx].innerText);
                if (!isNaN(pVal)) pages.push(pVal);
            });

            if (pages.length === 0 && type === 'add') pages = [...allPages];
            if (pages.length === 0) { document.getElementById('calc-result').innerText = "ERR"; return; }

            let result = 0;
            if (type === 'add') result = pages.reduce((a, b) => a + b, 0);

            document.getElementById('calc-result').innerText = result;
            clearAllSelections();
        }

        window.execModCalculated = function(divisor) {
            let allPages = [];
            for (let i = 0; i < 4; i++) {
                const pVal = parseInt(outputs[i].innerText);
                if (!isNaN(pVal)) allPages.push(pVal);
            }
            if (allPages.length === 0) { closeModOverlay(); return; }

            const maxPage = Math.max(...allPages);
            document.getElementById('calc-result').innerText = maxPage % divisor;
            closeModOverlay();
            clearAllSelections();
        }

        window.closeModOverlay = function() {
            document.getElementById('mod-overlay').style.display = 'none';
        }

        function clearSlotsOnly() {
            displays.forEach(disp => disp.innerText = "-");
            outputs.forEach(out => out.innerText = "---");
            clearAllSelections();

        }

        function clearResultOnly() {
            document.getElementById('calc-result').innerText = "000";
            closeModOverlay();
        }

        /* --- 電卓機能 --- */
    </script>
