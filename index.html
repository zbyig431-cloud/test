<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Q 辞書ツール</title>
    <style>
        * { box-sizing: border-box; font-family: 'Courier New', Courier, monospace, sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%; height: 100%; margin: 0; padding: 0;
            background-color: #0c0714; color: #ebd6ff;
            overflow: hidden; -webkit-overflow-scrolling: touch;
            overscroll-behavior: none;
        }
        button { font-family: inherit; }

        /* ═══ ホーム画面 ═══ */
        #home-screen {
            position: fixed; inset: 0; z-index: 100;
            background: radial-gradient(circle at 50% 30%, #1a0d2e 0%, #0c0714 70%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 16px; gap: 18px;
        }
        #home-screen.hidden { display: none; }
        .home-title { font-size: 1.6rem; color: #b57cff; margin: 0; text-shadow: 0 0 12px rgba(181,124,255,0.5); letter-spacing: 0.1em; }
        .home-sub { font-size: 0.7rem; color: rgba(181,124,255,0.6); margin: 0; text-align: center; line-height: 1.6; }
        .home-form { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 340px; }
        .home-form label { font-size: 0.7rem; color: #b57cff; font-weight: bold; text-align: center; }
        .home-form input {
            background: #140d21; border: 1.5px solid #b57cff; color: #00ff66;
            padding: 12px 10px; font-size: 0.9rem; border-radius: 6px; text-align: center; width: 100%;
        }
        .home-form input:focus { outline: none; border-color: #ff007f; box-shadow: 0 0 8px rgba(255,0,127,0.4); }
        .btn-start {
            background: linear-gradient(135deg,#5500aa,#220055); color: #ebd6ff;
            border: 1.5px solid #b57cff; padding: 14px; font-size: 1rem; font-weight: bold;
            border-radius: 6px; cursor: pointer; width: 100%;
        }
        .btn-start:active { background: #00ff64; color: #000; }
        .home-link { font-size: 0.55rem; color: rgba(181,124,255,0.4); text-decoration: underline; }

        /* ═══ メイン画面 ═══ */
        .app-wrapper { display: flex; flex-direction: column; width: 100%; height: 100%; padding: 4px; }

        .top-bar { display: flex; justify-content: space-between; align-items: center; height: 24px; margin-bottom: 4px; flex-shrink: 0; }
        .top-bar h1 { font-size: 0.8rem; margin: 0; color: #b57cff; }
        .btn-home {
            background: #1a0d2e; color: #b57cff; border: 1px solid rgba(181,124,255,0.5);
            padding: 2px 10px; font-size: 0.65rem; font-weight: bold; border-radius: 4px; cursor: pointer; height: 20px;
        }
        .btn-home:active { background: #b57cff; color: #000; }

        .main-layout { display: flex; flex: 1; gap: 6px; min-height: 0; }

        /* 左カラム: カメラ + 計算結果 */
        .left-column { flex: 1 1 55%; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
        .camera-container {
            width: 100%; aspect-ratio: 16/9; max-height: 62vh;
            background: #000; border: 1.5px solid #b57cff; border-radius: 6px;
            overflow: hidden; position: relative; flex-shrink: 0;
        }
        #camera-stream { width: 100%; height: 100%; object-fit: cover; display: block; }
        .loading-dimmer { display: none; position: absolute; inset: 0; background: rgba(20,5,35,0.55); z-index: 10; justify-content: center; align-items: center; font-size: 0.8rem; color: #00ff66; }
        .loading-dimmer.active { display: flex; }
        .loading-dimmer::after { content: "SCANNING KANJI..."; animation: blink 0.5s infinite alternate; }
        @keyframes blink { from { opacity: 0.3; } to { opacity: 1; } }

        /* 計算結果表示枠（カメラの下） */
        .result-display {
            flex: 1; min-height: 80px;
            background: #06030a; border: 1.5px solid #b57cff; border-radius: 6px;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            padding: 6px 8px; gap: 2px;
        }
        .result-display .res-formula { font-size: 0.85rem; color: #ffffff; line-height: 1.1; min-height: 1em; opacity: 0.85; text-align: center; }
        .result-display .res-num { font-size: 3.4rem; font-weight: bold; color: #ff007f; text-shadow: 0 0 10px #ff007f; line-height: 1; }

        /* 右カラム: スロット + 計算ボタン + 電卓 */
        .right-column { flex: 1 1 45%; display: flex; flex-direction: column; gap: 6px; min-width: 0; }

        .section-title { font-size: 0.6rem; font-weight: bold; color: #b57cff; margin: 0; }

        /* スロット（大型化・2x2） */
        .slots-container { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; flex-shrink: 0; }
        .slot-box {
            background: #150f24; border: 1.5px solid rgba(181,124,255,0.4); border-radius: 8px;
            padding: 10px 4px; text-align: center; display: flex; flex-direction: column;
            cursor: pointer; user-select: none; transition: border-color 0.15s, background 0.15s;
            min-height: 92px; justify-content: center;
        }
        .slot-box.selected { border: 1.5px solid #ff007f; background: #2b0c1e; }
        .slot-box .label { font-size: 0.7rem; color: #b57cff; pointer-events: none; }
        .slot-box.selected .label { color: #ff007f; }
        .slot-box .kanji-display { font-size: 2.2rem; color: #fff; font-weight: bold; line-height: 1.2; pointer-events: none; }
        .slot-box .page-output { font-size: 1.2rem; font-weight: bold; color: #00ff64; pointer-events: none; }

        /* 計算ボタン群（スロットの下） */
        .calc-buttons { display: grid; grid-template-columns: repeat(5,1fr); gap: 6px; flex-shrink: 0; }
        .btn-calc {
            background: #2b124c; border: 1.5px solid #ff007f; color: #ff007f;
            font-size: 0.85rem; font-weight: bold; border-radius: 6px; cursor: pointer;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 10px 2px; min-height: 60px; line-height: 1.3; gap: 3px;
        }
        .btn-calc:active { background: #ff007f; color: #000; }
        .btn-calc .ico { font-size: 1.1rem; }

        /* 電卓（右側） */
        .calc-section { display: flex; flex-direction: column; gap: 4px; flex: 1; min-height: 0; }
        .btn-calc-toggle {
            background: #1a0d2e; color: #b57cff; border: 1px solid rgba(181,124,255,0.5);
            padding: 6px; font-size: 0.7rem; font-weight: bold; border-radius: 4px; cursor: pointer; flex-shrink: 0;
        }
        .btn-calc-toggle:active { background: #b57cff; color: #000; }
        .calc-panel {
            background: rgba(27,15,46,0.6); border: 1px solid rgba(181,124,255,0.3); border-radius: 6px;
            padding: 5px; display: flex; flex-direction: column; gap: 4px; flex: 1; min-height: 0;
            position: relative;
        }
        .calc-display {
            background: #06030a; border: 1px solid #b57cff; border-radius: 4px;
            padding: 6px 8px; text-align: right; font-size: 1.3rem; font-weight: bold;
            color: #00ff64; min-height: 36px; overflow: hidden; white-space: nowrap; flex-shrink: 0;
        }
        .calc-keypad { display: grid; grid-template-columns: repeat(4,1fr); gap: 4px; flex: 1; min-height: 0; }
        .btn-calc-key {
            background: #1d0e30; border: 1px solid #b57cff; color: #ebd6ff;
            font-size: 1rem; font-weight: bold; border-radius: 4px; cursor: pointer;
            display: flex; justify-content: center; align-items: center; min-height: 32px;
        }
        .btn-calc-key:active { background: #b57cff; color: #000; }
        .btn-calc-key.op { background: #2b124c; border-color: #ff007f; color: #ff007f; }
        .btn-calc-key.op:active { background: #ff007f; color: #000; }
        .btn-calc-key.eq { background: #3a1525; border-color: #ff3388; color: #ff99cc; }
        .btn-calc-key.eq:active { background: #ff3388; color: #fff; }
        .btn-calc-key.cl { background: #3a1525; border-color: #ff3388; color: #ff99cc; font-size: 0.8rem; }
        .btn-calc-key.cl:active { background: #ff3388; color: #fff; }

        /* サジェスト + 手入力 + リセット */
        .utility-row { display: flex; gap: 5px; flex-shrink: 0; align-items: stretch; }
        .suggest-container {
            flex: 1; background: rgba(0,0,0,0.4); border: 1px dashed rgba(181,124,255,0.2);
            padding: 4px; border-radius: 5px; min-height: 38px; display: flex; align-items: center; gap: 4px;
        }
        .suggest-title { font-size: 0.55rem; color: #aaa; white-space: nowrap; }
        .suggest-buttons { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; }
        .btn-suggest {
            background: #25163a; border: 1px solid #b57cff; color: #ebd6ff;
            padding: 4px 8px; font-size: 0.7rem; border-radius: 3px; cursor: pointer;
        }
        .btn-suggest:active { background: #00ff64; color: #000; }
        .manual-search-container {
            display: flex; align-items: center; gap: 4px; flex-shrink: 0;
        }
        .manual-search-input {
            background: #140d21; border: 1px solid #b57cff; color: #fff;
            padding: 6px; font-size: 0.8rem; border-radius: 4px; text-align: center; font-weight: bold;
            width: 44px; height: 38px;
        }
        .btn-manual-submit {
            background: #4a1c6d; border: 1px solid #b57cff; color: #ebd6ff;
            padding: 0 10px; font-size: 0.7rem; font-weight: bold; border-radius: 4px; cursor: pointer; height: 38px;
        }
        .btn-manual-submit:active { background: #00ff64; color: #000; }

        .reset-container { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex-shrink: 0; margin-top: 4px; }
        .btn-reset-half {
            background: #3a1525; border: 1px solid #ff3388; color: #ff99cc;
            font-size: 0.8rem; font-weight: bold; border-radius: 6px; cursor: pointer;
            display: flex; justify-content: center; align-items: center; height: 44px;
        }
        .btn-reset-half:active { background: #ff3388; color: #fff; }

        /* 剰余オーバーレイ */
        .mod-selector-overlay { display: none; position: absolute; inset: 0; background: rgba(12,7,20,0.97); border-radius: 6px; z-index: 20; flex-direction: column; justify-content: center; align-items: center; padding: 8px; }
        .mod-selector-overlay.active { display: flex; }
        .mod-selector-title { font-size: 0.75rem; color: #ff007f; margin-bottom: 6px; font-weight: bold; text-align: center; }
        .mod-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 5px; width: 100%; max-width: 240px; }
        .btn-mod-num {
            background: #1d0e30; border: 1px solid #b57cff; color: #00ff66;
            font-size: 1.1rem; font-weight: bold; border-radius: 5px; cursor: pointer; padding: 12px 0;
        }
        .btn-mod-num:active { background: #00ff66; color: #000; }
        .btn-mod-cancel {
            grid-column: span 3; background: #333; border: none; color: #fff;
            padding: 8px; font-size: 0.7rem; border-radius: 4px; margin-top: 4px; cursor: pointer;
        }

        /* ═══ スキャンボタン（画面右下・大型FAB） ═══ */
        .btn-shutter-fab {
            position: fixed; bottom: 20px; right: 20px; z-index: 50;
            width: 100px; height: 100px; border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ff007f 0%, #5500aa 80%);
            color: #fff; border: 4px solid #ebd6ff; font-size: 0.85rem; font-weight: bold;
            cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center;
            gap: 3px; box-shadow: 0 6px 20px rgba(255,0,127,0.6); line-height: 1.1;
            transition: transform 0.1s;
        }
        .btn-shutter-fab:active { transform: scale(0.92); }
        .btn-shutter-fab:disabled { opacity: 0.5; }
        .btn-shutter-fab .fab-ico { font-size: 2.1rem; line-height: 1; }

        /* 縦画面対応 */
        @media (max-aspect-ratio: 13/10) {
            .main-layout { flex-direction: column; overflow-y: auto; }
            .left-column { flex: 0 0 auto; }
            .right-column { flex: 0 0 auto; }
            .camera-container { max-height: 40vh; }
            .result-display { min-height: 56px; }
            .result-display .res-num { font-size: 1.6rem; }
            .calc-panel { min-height: 180px; }
        }
    </style>
</head>
<body>

    <!-- ═══ ホーム画面 ═══ -->
    <div id="home-screen">
        <h1 class="home-title">Q 辞書ツール</h1>
        <p class="home-sub">辞書に基づく漢字認識ツール<br>使用前に Gemini APIキーを入力してください</p>
        <div class="home-form">
            <label for="home-api-key">Gemini API KEY</label>
            <input type="password" id="home-api-key" placeholder="APIキーを入力">
            <button class="btn-start" id="btn-start">開始</button>
        </div>
        <a class="home-link" href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">APIキー取得（Google AI Studio）</a>
    </div>

    <!-- ═══ メイン画面 ═══ -->
    <div class="app-wrapper" id="main-screen" style="display:none;">

        <div class="top-bar">
            <h1>Q 辞書ツール</h1>
            <button class="btn-home" id="btn-go-home">ホーム</button>
        </div>

        <div class="main-layout">

            <!-- 左: カメラ + 計算結果 -->
            <div class="left-column">
                <div class="camera-container">
                    <video id="camera-stream" autoplay playsinline muted></video>
                    <div class="loading-dimmer" id="scan-indicator"></div>
                </div>
                <div class="result-display">
                    <div class="res-formula" id="calc-formula">　</div>
                    <div class="res-num" id="calc-result">000</div>
                </div>
            </div>

            <!-- 右: スロット + 計算 + 電卓 -->
            <div class="right-column">

                <div class="slots-container">
                    <div class="slot-box" id="slot-container-0" onclick="toggleSlotSelect(0)">
                        <span class="label">S1</span>
                        <div class="kanji-display" id="slot-k-0">-</div>
                        <span class="page-output" id="slot-p-0">---</span>
                    </div>
                    <div class="slot-box" id="slot-container-1" onclick="toggleSlotSelect(1)">
                        <span class="label">S2</span>
                        <div class="kanji-display" id="slot-k-1">-</div>
                        <span class="page-output" id="slot-p-1">---</span>
                    </div>
                    <div class="slot-box" id="slot-container-2" onclick="toggleSlotSelect(2)">
                        <span class="label">S3</span>
                        <div class="kanji-display" id="slot-k-2">-</div>
                        <span class="page-output" id="slot-p-2">---</span>
                    </div>
                    <div class="slot-box" id="slot-container-3" onclick="toggleSlotSelect(3)">
                        <span class="label">S4</span>
                        <div class="kanji-display" id="slot-k-3">-</div>
                        <span class="page-output" id="slot-p-3">---</span>
                    </div>
                </div>

                <div class="calc-buttons">
                    <button class="btn-calc" onclick="calculate('add')"><span class="ico">➕</span>足</button>
                    <button class="btn-calc" onclick="calculate('sub')"><span class="ico">➖</span>引</button>
                    <button class="btn-calc" onclick="calculate('double')"><span class="ico">✖</span>2倍</button>
                    <button class="btn-calc" onclick="calculate('rem')"><span class="ico">％</span>剰余</button>
                    <button class="btn-calc" onclick="calculate('sort_digits')"><span class="ico">🔁</span>替</button>
                </div>

                <div class="utility-row">
                    <div class="suggest-container">
                        <div class="suggest-title">候補:</div>
                        <div class="suggest-buttons" id="suggest-area">
                            <span style="color:rgba(181,124,255,0.3); font-size:0.6rem;">ここに並びます</span>
                        </div>
                    </div>
                    <div class="manual-search-container">
                        <input type="text" class="manual-search-input" id="manual-kanji-input" maxlength="1" placeholder="手">
                        <button class="btn-manual-submit" onclick="submitManualKanji()">登録</button>
                    </div>
                </div>

                <div class="calc-section">
                    <button class="btn-calc-toggle" id="calc-toggle-btn">電卓を開く / 閉じる</button>
                    <div class="calc-panel" id="calc-panel" style="display:none;">
                        <div class="mod-selector-overlay" id="mod-overlay">
                            <div class="mod-selector-title">最大ページ数を何で割る？</div>
                            <div class="mod-grid">
                                <button class="btn-mod-num" onclick="execModCalculated(1)">1</button>
                                <button class="btn-mod-num" onclick="execModCalculated(2)">2</button>
                                <button class="btn-mod-num" onclick="execModCalculated(3)">3</button>
                                <button class="btn-mod-num" onclick="execModCalculated(4)">4</button>
                                <button class="btn-mod-num" onclick="execModCalculated(5)">5</button>
                                <button class="btn-mod-num" onclick="execModCalculated(6)">6</button>
                                <button class="btn-mod-num" onclick="execModCalculated(7)">7</button>
                                <button class="btn-mod-num" onclick="execModCalculated(8)">8</button>
                                <button class="btn-mod-num" onclick="execModCalculated(9)">9</button>
                                <button class="btn-mod-cancel" onclick="closeModOverlay()">戻る</button>
                            </div>
                        </div>
                        <div class="calc-display" id="calc-display">0</div>
                        <div class="calc-keypad">
                            <button class="btn-calc-key cl" onclick="calcKey('C')">C</button>
                            <button class="btn-calc-key op" onclick="calcKey('÷')">÷</button>
                            <button class="btn-calc-key op" onclick="calcKey('×')">×</button>
                            <button class="btn-calc-key op" onclick="calcKey('−')">−</button>
                            <button class="btn-calc-key" onclick="calcKey('7')">7</button>
                            <button class="btn-calc-key" onclick="calcKey('8')">8</button>
                            <button class="btn-calc-key" onclick="calcKey('9')">9</button>
                            <button class="btn-calc-key op" onclick="calcKey('+')">+</button>
                            <button class="btn-calc-key" onclick="calcKey('4')">4</button>
                            <button class="btn-calc-key" onclick="calcKey('5')">5</button>
                            <button class="btn-calc-key" onclick="calcKey('6')">6</button>
                            <button class="btn-calc-key eq" onclick="calcKey('=')" style="grid-row: span 4;">＝</button>
                            <button class="btn-calc-key" onclick="calcKey('1')">1</button>
                            <button class="btn-calc-key" onclick="calcKey('2')">2</button>
                            <button class="btn-calc-key" onclick="calcKey('3')">3</button>
                            <button class="btn-calc-key" onclick="calcKey('0')" style="grid-column: span 2;">0</button>
                        </div>
                    </div>
                </div>

                <div class="reset-container">
                    <button class="btn-reset-half" id="btn-clear-slots">スロットクリア</button>
                    <button class="btn-reset-half" id="btn-clear-result">結果クリア</button>
                </div>
            </div>
        </div>
    </div>

    <!-- スキャンボタン（右下FAB） -->
    <button class="btn-shutter-fab" id="shutter-trigger" disabled>
        <span class="fab-ico">◉</span>
        <span>スキャン</span>
    </button>

    <canvas id="capture-canvas" style="display:none;"></canvas>

    <script>

            "箱":906,"簾":910,"粉":913,"系":920,"約":922,"組":929,"絶":934,"紫":934,"続":938,
            "緜":947,"缶":954,"罪":956,"美":959,"義":961,"羸":963,"耐":970,"耕":971,"耽":973,
            "聞":975,"腐":979,"興":985,"船":989,"良":991,"艱":992,"苦":1001,"茶":1007,"葉":1018,
            "蘭":1036,"虚":1038,"蜜":1047,"表":1058,"裁":1060,"裏":1061,"褒":1063,"補":1066,"襷":1070,
            "臣":1073,"解":1080,"計":1083,"誠":1093,"誉":1094,"謄":1108,"謦":1109,"象":1115,"財":1119,
            "買":1123,"贋":1130,"踊":1139,"転":1147,"込":1158,"述":1161,"邪":1188,"酒":1192,
            "醸":1197,"重":1199,"針":1205,"釘":1205,"銜":1209,"鍵":1216,"鏖":1219,"鑿":1222,"開":1226,
            "険":1238,"雇":1247,"難":1251,"需":1256,"霖":1257,"靖":1260,"響":1269,"預":1273,"顔":1276,
            "飆":1282,"飴":1286,"餅":1287,"首":1290,"馮":1293,"駐":1296,"騰":1298,"髪":1305,"髭":1305,
            "鬨":1306,"鮭":1312,"鳴":1319,"鸞":1326,"麾":1330,"黄":1331,"黐":1332,"黶":1334
        };
        const DICT_KEYS = Object.keys(KANJI_DICTIONARY);

        let streamObject = null;
        let selectedSlots = new Set();
        let scanning = false;
        let cameraReady = false;

        const displays = [
            document.getElementById('slot-k-0'), document.getElementById('slot-k-1'),
            document.getElementById('slot-k-2'), document.getElementById('slot-k-3')
        ];
        const outputs = [
            document.getElementById('slot-p-0'), document.getElementById('slot-p-1'),
            document.getElementById('slot-p-2'), document.getElementById('slot-p-3')
        ];
        const containers = [
            document.getElementById('slot-container-0'), document.getElementById('slot-container-1'),
            document.getElementById('slot-container-2'), document.getElementById('slot-container-3')
        ];

        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('q_api_key');
            if (savedKey) document.getElementById('home-api-key').value = savedKey;

            document.getElementById('btn-start').addEventListener('click', startApp);
            document.getElementById('btn-go-home').addEventListener('click', goHome);
            document.getElementById('shutter-trigger').addEventListener('click', captureAndScan);
            document.getElementById('btn-clear-slots').addEventListener('click', clearSlotsOnly);
            document.getElementById('btn-clear-result').addEventListener('click', clearResultOnly);
            document.getElementById('calc-toggle-btn').addEventListener('click', toggleCalcPanel);

            document.getElementById('home-api-key').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') startApp();
            });
            document.getElementById('manual-kanji-input').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') submitManualKanji();
            });
        });

        function startApp() {
            const key = document.getElementById('home-api-key').value.trim();
            if (!key) { alert('APIキーを入力してください'); return; }
            localStorage.setItem('q_api_key', key);
            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('main-screen').style.display = 'flex';
            if (!cameraReady) initCameraStream();
        }

        function goHome() {
            document.getElementById('home-screen').classList.remove('hidden');
            document.getElementById('main-screen').style.display = 'none';
        }

        async function initCameraStream() {
            const video = document.getElementById('camera-stream');
            try {
                streamObject = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false
                }).catch(() => navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false
                })).catch(() => navigator.mediaDevices.getUserMedia({ video: true, audio: false }));
                video.srcObject = streamObject;
                cameraReady = true;
                document.getElementById('shutter-trigger').disabled = false;
            } catch (err) {
                alert("カメラ起動失敗: " + err.message);
            }
        }

        window.toggleSlotSelect = function(idx) {
            if (selectedSlots.has(idx)) {
                selectedSlots.delete(idx);
                containers[idx].classList.remove('selected');
            } else {
                selectedSlots.add(idx);
                containers[idx].classList.add('selected');
            }
        }

        function clearAllSelections() {
            selectedSlots.clear();
            containers.forEach(c => c.classList.remove('selected'));
        }

        window.submitManualKanji = function() {
            const inputEl = document.getElementById('manual-kanji-input');
            const kanji = inputEl.value.trim();
            if (!kanji) return;
            let targetIdx = -1;
            for (let i = 0; i < 4; i++) {
                if (!selectedSlots.has(i) && (displays[i].innerText === "-" || !displays[i].innerText)) { targetIdx = i; break; }
            }
            if (targetIdx === -1) {
                for (let i = 0; i < 4; i++) { if (!selectedSlots.has(i)) { targetIdx = i; break; } }
            }
            if (targetIdx === -1) { alert("全てホールドされています"); return; }
            displays[targetIdx].innerText = kanji;
            outputs[targetIdx].innerText = KANJI_DICTIONARY[kanji] ? KANJI_DICTIONARY[kanji] : "未登録";
            inputEl.value = ""; inputEl.blur();
        }

        function preprocessCapture(video) {
            const canvas = document.getElementById('capture-canvas');
            const vw = video.videoWidth || 1920, vh = video.videoHeight || 1080, UPSCALE = 2;
            canvas.width = vw * UPSCALE; canvas.height = vh * UPSCALE;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            let minLum = 255, maxLum = 0;
            for (let i = 0; i < data.length; i += 4) {
                const lum = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
                if (lum < minLum) minLum = lum;
                if (lum > maxLum) maxLum = lum;
            }
            const range = Math.max(1, maxLum - minLum);
            for (let i = 0; i < data.length; i += 4) {
                const lum = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
                const stretched = ((lum - minLum) / range) * 255;
                const ratio = lum > 0 ? stretched / lum : 1;
                data[i] = Math.min(255, Math.max(0, data[i] * ratio));
                data[i+1] = Math.min(255, Math.max(0, data[i+1] * ratio));
                data[i+2] = Math.min(255, Math.max(0, data[i+2] * ratio));
            }
            ctx.putImageData(imgData, 0, 0);
            return canvas.toDataURL('image/jpeg', 0.92).replace(/^data:image\/jpeg;base64,/, "");
        }

        async function scanWithGemini(base64Image, apiKey) {
            const kanjiList = DICT_KEYS.join('・');
            const prompt =
                'この画像には日本語のテキストが写っています。' +
                '「」（かぎかっこ）で囲まれている漢字を全て探してください。' +
                '見つけた漢字は必ず下記の【候補リスト】の中から最も近いものを選んで回答してください。' +
                'リストに含まれない文字は絶対に回答しないでください。' +
                '【候補リスト】：' + kanjiList + '\n' +
                '回答形式：見つかった漢字をカンマ区切りで列挙してください（例: 謦,鬨）。見つからなければ「なし」と答えてください。';
            const response = await fetch(
                'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=' + apiKey,
                {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: 'image/jpeg', data: base64Image } }] }],
                        generationConfig: { temperature: 0 }
                    })
                }
            );
            const data = await response.json();
            const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
            if (raw.includes('なし') || raw.trim() === '') return [];
            return raw.split(/[,、，\s]+/).map(s => s.trim()).filter(s => KANJI_DICTIONARY[s] !== undefined);
        }

        async function captureAndScan() {
            if (scanning) return;
            const video = document.getElementById('camera-stream');
            const apiKey = localStorage.getItem('q_api_key');
            if (!apiKey) { alert("APIキーが未設定。ホーム画面で入力してください。"); return; }
            if (!video.srcObject) { alert("カメラ未準備"); return; }

            scanning = true;
            const shutterBtn = document.getElementById('shutter-trigger');
            shutterBtn.disabled = true;
            document.getElementById('scan-indicator').classList.add('active');

            try {
                const base64Image = preprocessCapture(video);
                const foundKanji = await scanWithGemini(base64Image, apiKey);

                for (let i = 0; i < 4; i++) {
                    if (!selectedSlots.has(i)) { displays[i].innerText = "-"; outputs[i].innerText = "---"; }
                }
                foundKanji.forEach(char => {
                    let isDuplicate = false;
                    for (let i = 0; i < 4; i++) { if (displays[i].innerText === char) { isDuplicate = true; break; } }
                    if (isDuplicate) return;
                    let targetIdx = -1;
                    for (let i = 0; i < 4; i++) {
                        if (!selectedSlots.has(i) && (displays[i].innerText === "-" || !displays[i].innerText)) { targetIdx = i; break; }
                    }
                    if (targetIdx !== -1) {
                        displays[targetIdx].innerText = char;
                        outputs[targetIdx].innerText = KANJI_DICTIONARY[char];
                    }
                });
                generateSuggestions(foundKanji);
            } catch (e) {
                alert("スキャンエラー。APIキーや通信を確認してください。");
            } finally {
                scanning = false;
                shutterBtn.disabled = false;
                document.getElementById('scan-indicator').classList.remove('active');
            }
        }

        function generateSuggestions(foundKanji) {
            const suggestArea = document.getElementById('suggest-area');
            suggestArea.innerHTML = "";
            let candidates = DICT_KEYS.filter(k => !foundKanji.includes(k)).slice(0, 4);
            if (candidates.length === 0) {
                suggestArea.innerHTML = '<span style="color:rgba(181,124,255,0.3); font-size:0.6rem;">候補なし</span>';
                return;
            }
            candidates.forEach(kanji => {
                const btn = document.createElement('button');
                btn.className = 'btn-suggest';
                btn.innerText = kanji + '(' + KANJI_DICTIONARY[kanji] + ')';
                btn.onclick = () => {
                    let targetIdx = -1;
                    for (let i = 0; i < 4; i++) {
                        if (!selectedSlots.has(i) && (displays[i].innerText === "-" || !displays[i].innerText)) { targetIdx = i; break; }
                    }
                    if (targetIdx !== -1) {
                        displays[targetIdx].innerText = kanji;
                        outputs[targetIdx].innerText = KANJI_DICTIONARY[kanji];
                    }
                };
                suggestArea.appendChild(btn);
            });
        }

        window.calculate = function(type) {
            const resEl = document.getElementById('calc-result');
            let allPages = [];
            for (let i = 0; i < 4; i++) {
                const pVal = parseInt(outputs[i].innerText);
                if (!isNaN(pVal)) allPages.push(pVal);
            }
            if (type === 'double') {
                if (allPages.length === 0) { resEl.innerText = "ERR"; setFormula(""); return; }
                const mx = Math.max(...allPages);
                resEl.innerText = mx * 2;
                setFormula(mx + ' × 2');
                clearAllSelections(); return;
            }
            if (type === 'sort_digits') {
                if (allPages.length === 0) { resEl.innerText = "ERR"; setFormula(""); return; }
                allPages.sort((a, b) => b - a);
                let combinedResult = "";
                allPages.forEach(p => { combinedResult += (p % 10).toString(); });
                resEl.innerText = combinedResult;
                setFormula(allPages.join(' > ') + ' の下一桁');
                clearAllSelections(); return;
            }
            if (type === 'sub') {
                if (allPages.length < 1) { resEl.innerText = "ERR"; setFormula(""); return; }
                const mx = Math.max(...allPages), mn = Math.min(...allPages);
                resEl.innerText = mx - mn;
                setFormula(mx + ' − ' + mn);
                clearAllSelections(); return;
            }
            if (type === 'rem') {
                if (allPages.length === 0) { alert("数値がありません"); return; }
                document.getElementById('mod-overlay').classList.add('active');
                return;
            }
            let pages = [];
            selectedSlots.forEach(idx => {
                const pVal = parseInt(outputs[idx].innerText);
                if (!isNaN(pVal)) pages.push(pVal);
            });
            if (pages.length === 0 && type === 'add') pages = [...allPages];
            if (pages.length === 0) { resEl.innerText = "ERR"; setFormula(""); return; }
            let result = 0;
            if (type === 'add') result = pages.reduce((a, b) => a + b, 0);
            resEl.innerText = result;
            setFormula(pages.join(' + '));
            clearAllSelections();
        }

        window.execModCalculated = function(divisor) {
            let allPages = [];
            for (let i = 0; i < 4; i++) {
                const pVal = parseInt(outputs[i].innerText);
                if (!isNaN(pVal)) allPages.push(pVal);
            }
            if (allPages.length === 0) { closeModOverlay(); return; }
            const mx = Math.max(...allPages);
            document.getElementById('calc-result').innerText = mx % divisor;
            setFormula(mx + ' ÷ ' + divisor + ' の余り');
            closeModOverlay(); clearAllSelections();
        }

        window.closeModOverlay = function() { document.getElementById('mod-overlay').classList.remove('active'); }

        function clearSlotsOnly() {
            displays.forEach(disp => disp.innerText = "-");
            outputs.forEach(out => out.innerText = "---");
            clearAllSelections();
            document.getElementById('suggest-area').innerHTML = '<span style="color:rgba(181,124,255,0.3); font-size:0.6rem;">クリアしました</span>';
        }

        function clearResultOnly() {
            document.getElementById('calc-result').innerText = "000";
            setFormula("　");
            closeModOverlay();
        }

        let calcCurrent = "0", calcPrevious = null, calcOperator = null, calcShouldReset = false;
        function toggleCalcPanel() { const p = document.getElementById('calc-panel'); p.style.display = (p.style.display === 'flex') ? 'none' : 'flex'; }

        function setFormula(text) { document.getElementById('calc-formula').innerText = text; }

        window.calcKey = function(key) {
            const display = document.getElementById('calc-display');
            if (key === 'C') {
                calcCurrent = "0"; calcPrevious = null; calcOperator = null; calcShouldReset = false;
                display.innerText = "0"; return;
            }
            const compute = (a, b, op) => {
                if (op === '+') return a + b;
                if (op === '−') return a - b;
                if (op === '×') return a * b;
                if (op === '÷') return b !== 0 ? a / b : 0;
                return b;
            };
            if (key === '=') {
                if (calcOperator !== null && calcPrevious !== null) {
                    const r = compute(parseFloat(calcPrevious), parseFloat(calcCurrent), calcOperator);
                    calcCurrent = String(r); calcPrevious = null; calcOperator = null; calcShouldReset = true;
                    display.innerText = calcCurrent;
                }
                return;
            }
            if (key === '+' || key === '−' || key === '×' || key === '÷') {
                if (calcOperator !== null && calcPrevious !== null && !calcShouldReset) {
                    const r = compute(parseFloat(calcPrevious), parseFloat(calcCurrent), calcOperator);
                    calcCurrent = String(r);
                }
                calcPrevious = calcCurrent; calcOperator = key; calcShouldReset = true;
                display.innerText = calcCurrent; return;
            }
            if (/[0-9]/.test(key)) {
                if (calcCurrent === "0" || calcShouldReset) { calcCurrent = key; calcShouldReset = false; }
                else { calcCurrent += key; }
                display.innerText = calcCurrent;
            }
        }
    </script>
